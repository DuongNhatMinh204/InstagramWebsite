<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Trang Quản Trị - Danh Sách Người Dùng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<!-- HEADER -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="#">Admin Dashboard</a>
        <div class="d-flex">
            <button class="btn btn-outline-light" onclick="logout()" title="Đăng xuất">
                <i class="fas fa-sign-out-alt"></i> Logout
            </button>
        </div>
    </div>
</nav>

<!-- MAIN CONTENT -->
<div class="container mt-5">
    <h2 class="mb-4">Danh Sách Người Dùng</h2>
    <table class="table table-bordered table-striped">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Phone</th>
            <th>Email</th>
            <th>Full Name</th>
            <th>Nick Name</th>
            <th>Birthday</th>
            <th>Gender</th>
            <th>Avatar</th>
            <th>Status</th>
            <th>Hành động</th>
        </tr>
        </thead>
        <tbody id="userTableBody">
        </tbody>
    </table>
</div>

<script>
    const token = localStorage.getItem("token");

    function loadUsers() {
        fetch("/v1/auth/all-user", {
            method: "GET",
            headers: {
                "Authorization": "Bearer " + token
            }
        })
            .then(res => {
                if (res.status === 403 || res.status === 401) {
                    alert("Bạn không có quyền truy cập!");
                    window.location.href = "/login";
                }
                return res.json();
            })
            .then(data => {
                const tbody = document.getElementById("userTableBody");
                tbody.innerHTML = "";

                data.data.forEach((user) => {
                    const tr = document.createElement("tr");

                    tr.innerHTML = `
                      <td>${user.id}</td>
                      <td>${user.phone}</td>
                      <td>${user.email}</td>
                      <td>${user.fullName}</td>
                      <td>${user.nickName}</td>
                      <td>${user.birthday}</td>
                      <td>${user.gender}</td>
                      <td>${user.avatarUrl ? `<img src="${user.avatarUrl}" alt="avatar" width="50" height="50">` : ""}</td>
                      <td>${user.status === 1 ? "Hoạt động" : "Đã khóa"}</td>
                      <td>
                        <button class="btn ${user.status === 1 ? "btn-danger" : "btn-success"} btn-sm"
                          onclick="changeStatus(${user.id})">
                          ${user.status === 1 ? "Khóa" : "Mở khóa"}
                        </button>
                      </td>
                    `;

                    tbody.appendChild(tr);
                });
            })
            .catch(err => console.error("Lỗi khi load users:", err));
    }

    function changeStatus(userId) {
        fetch(`/v1/auth/change-status/${userId}`, {
            method: "PUT",
            headers: {
                "Authorization": "Bearer " + token
            }
        })
            .then(res => res.json())
            .then(() => {
                alert("Cập nhật trạng thái thành công!");
                loadUsers();
            })
            .catch(err => console.error("Lỗi khi thay đổi trạng thái:", err));
    }

    function logout() {
        fetch("/v1/auth/logout", {
            method: "POST",
            headers: {
                "Authorization": "Bearer " + token
            }
        })
            .then(res => res.text())
            .then(msg => {
                alert(msg);
                localStorage.removeItem("token");
                window.location.href = "/login";
            })
            .catch(err => console.error("Lỗi khi logout:", err));
    }

    // Tải danh sách khi vào trang
    loadUsers();
</script>
</body>
</html>
